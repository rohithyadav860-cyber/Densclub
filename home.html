{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DENS CLUB</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to right, #f8f9fa, #eef2f3);
        }

        header {
            background: #111;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            letter-spacing: 2px;
        }

        .header-btns a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            border: 1px solid white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .header-btns a:hover {
            background: white;
            color: black;
        }

        .offer {
            background: #ff5252;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .categories a {
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 25px;
            background: #222;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        .categories a:hover {
            background: #ff5252;
        }

        .hero-text {
            text-align: center;
            font-size: 24px;
            margin: 30px 0;
            font-weight: 500;
        }

        .images {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .images img {
            width: 220px;
            height: 280px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .shop {
            text-align: center;
            margin: 40px 0;
        }

        .shop a {
            display: inline-block;
            padding: 14px 45px;
            font-size: 18px;
            background: #ff5252;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            cursor: pointer;
        }

        .shop a:hover {
            background: #e84141;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>DENS CLUB</h1>
    <div class="header-btns">
        <a href="#">Settings</a>
        <a href="{% url 'signout' %}">Sign Out</a>
    </div>
</header>

<div class="offer">
    FLAT 50% DISCOUNT ON EVERY TRANSACTION
</div>

<div class="categories">
    <a href="#">MEN</a>
    <a href="#">WOMEN</a>
    <a href="#">LITTLE CHAMP</a>
    <a href="#">GEN Z</a>
</div>

<div class="hero-text">
    Embrace the season with new looks ✨
</div>

<div class="images">
    <img src="{% static 'images/1.jpg' %}" >
    <img src="{% static 'images/2.jpg' %}" >
    <img src="{% static 'images/3.jpg' %}" >
    <img src="{% static 'images/4.jpg' %}" >
</div>

<div class="shop">
    <a href="#">MY ORDERS</a>
</div>

<footer>
    © 2026 DENS CLUB. All Rights Reserved.
</footer>

</body>
</html>
